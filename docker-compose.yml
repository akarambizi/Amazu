services:
    client:
        build: ./client
        ports:
            - 3000:3000
        volumes:
            - ./client:/app
            - /app/node_modules
        environment:
            - NODE_ENV=development
            - VITE_API_ENV=dev
            - DOCKER_ENV=true
        command: pnpm run start --host
        depends_on:
            - server

    server:
        build: ./server
        ports:
            - 5000:5000
            - 9464:9464 # prometheus
        volumes:
            - ./server:/app
            - /app/node_modules
        environment:
            - NODE_ENV=development
            - DOCKER_ENV=true
            - MONGO_URI_DOCKER=mongodb://mongo:27017/Amazu
        command: pnpm run serve
        depends_on:
            - mongo

    mongo:
        image: mongo:7
        ports:
            - '27017:27017'
        volumes:
            - amazu-mongo-data:/data/db

    zipkin:
        image: openzipkin/zipkin
        ports:
            - '9411:9411'
        depends_on:
            - server

    prometheus:
        image: prom/prometheus
        volumes:
            - ./server/prometheus.yml:/etc/prometheus/prometheus.yml
        command:
            - '--config.file=/etc/prometheus/prometheus.yml'
        ports:
            - 9090:9090
        depends_on:
            - server

    grafana:
        image: grafana/grafana
        ports:
            - 4000:3000
        depends_on:
            - prometheus

volumes:
    amazu-mongo-data:
