version: 2
updates:
  # Root (shared ESLint/Prettier/Husky tooling)
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore(deps)'

  # Client (React/Vite)
  - package-ecosystem: 'npm'
    directory: '/client'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'area/client'
    commit-message:
      prefix: 'chore(deps)'

  # Server (Express/TypeScript)
  - package-ecosystem: 'npm'
    directory: '/server'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'area/server'
    commit-message:
      prefix: 'chore(deps)'

  # Client Docker base image
  - package-ecosystem: 'docker'
    directory: '/client'
    schedule:
      interval: 'weekly'
      day: 'monday'
    labels:
      - 'dependencies'
      - 'area/client'

  # Server Docker base image
  - package-ecosystem: 'docker'
    directory: '/server'
    schedule:
      interval: 'weekly'
      day: 'monday'
    labels:
      - 'dependencies'
      - 'area/server'

  # GitHub Actions workflows themselves
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    labels:
      - 'dependencies'
      - 'area/ci'
