name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: '10.17.1'
  NODE_VERSION: '20'

jobs:
  client:
    name: Client (lint, build, test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            client/pnpm-lock.yaml

      # Root deps hold the shared ESLint/Prettier config that client/server's
      # own eslint binary resolves via Node's parent-directory node_modules lookup.
      - name: Install root deps
        run: pnpm install --frozen-lockfile

      - name: Install client deps
        working-directory: client
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: client
        run: pnpm run lint

      - name: Build
        working-directory: client
        run: pnpm run build

      - name: Test
        working-directory: client
        run: pnpm run test

  server:
    name: Server (lint, build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            server/pnpm-lock.yaml

      - name: Install root deps
        run: pnpm install --frozen-lockfile

      - name: Install server deps
        working-directory: server
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: server
        run: pnpm run lint

      - name: Build
        working-directory: server
        run: pnpm run build

      # NOTE: no test step yet - server has no test runner (see
      # docs/IMPROVEMENTS.md section 2, "Add a server test runner"). Add one
      # here (with a mongodb-memory-server or services: mongo: ... block)
      # once that's implemented.
